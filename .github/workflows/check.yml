name: check

on:
   pull_request:
   push:
      branches: [main]

jobs:
   windows:
      runs-on: windows-latest
      defaults:
         run:
            shell: bash
      steps:
         - uses: actions/checkout@v5
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: 1.4.5
         - name: install
           run: bun install --frozen-lockfile
         - name: time private-file with and without its folder caches
           run: bun tools/bench-private.ts
