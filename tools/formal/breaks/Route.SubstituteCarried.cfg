\* A request keeps the substitute it got at one BAA account when it moves to one that carries its model. Only a walk in the
\* file's order reaches a carrying account after a lacking one, so the walk is bent too.
SPECIFICATION Spec
CONSTANTS
    Sessions = {{k1, k2, k3}, {m1, m2, m3}}
    Slots = {a}
    OpenAccounts = 2
    BaaAccounts = 2
    MaxNew = 1
    MaxHistory = 2
    Lacking = {1}
    Substitute <- SubstituteCarried
    BaaWalk <- BaaWalkInFileOrder
INVARIANT SubstitutePerAccount
