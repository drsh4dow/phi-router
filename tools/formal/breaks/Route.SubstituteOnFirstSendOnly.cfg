\* Only the first send of a request can name the substitute, so a request that moves to a BAA account that lacks its model keeps that model there.
SPECIFICATION Spec
CONSTANTS
    Sessions = {{k1, k2, k3}, {m1, m2, m3}}
    Slots = {a}
    OpenAccounts = 2
    BaaAccounts = 2
    MaxNew = 1
    MaxHistory = 2
    Lacking = {1}
    Substitute <- SubstituteOnFirstSendOnly
INVARIANT SubstitutePerAccount
