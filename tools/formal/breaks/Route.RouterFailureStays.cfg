\* A request the clean lane refused stays at its open account, which receives the body built for the sealed lane.
SPECIFICATION Spec
CONSTANTS
    Sessions = {{k1, k2, k3}, {m1, m2, m3}}
    Slots = {a}
    OpenAccounts = 2
    BaaAccounts = 1
    MaxNew = 1
    MaxHistory = 2
    Lacking = {1}
    RouterFailure <- RouterFailureStays
INVARIANT NoSealedPartAtOpenAccount
