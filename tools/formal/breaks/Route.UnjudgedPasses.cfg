\* The router judges only the new content and the border stubs sealed parts only,
\* so a part from a pinned stretch reaches an open account unjudged. Either bug
\* alone leaks nothing: the router judges every part before the border runs.
SPECIFICATION Spec
CONSTANTS
    Sessions = {{k1, k2, k3}, {m1, m2, m3}}
    Slots = {a}
    OpenAccounts = 2
    BaaAccounts = 1
    MaxNew = 1
    MaxHistory = 2
    Lacking = {1}
    Passes <- PassesUnjudged
    ToJudge <- ToJudgeNewContentOnly
INVARIANT NoUnjudgedPartAtOpenAccount
