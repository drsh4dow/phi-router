\* Past the last BAA account the walk goes back to the clean lane.
SPECIFICATION Spec
CONSTANTS
    Sessions = {{k1, k2, k3}, {m1, m2, m3}}
    Slots = {a}
    OpenAccounts = 2
    BaaAccounts = 1
    MaxNew = 1
    MaxHistory = 2
    Lacking = {1}
