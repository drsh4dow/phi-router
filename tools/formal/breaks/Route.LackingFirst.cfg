\* The sealed walk keeps the file's order, so the first BAA account, which lacks the target model, gets the request before the one that carries it.
SPECIFICATION Spec
CONSTANTS
    Sessions = {{k1, k2, k3}, {m1, m2, m3}}
    Slots = {a}
    OpenAccounts = 2
    BaaAccounts = 2
    MaxNew = 1
    MaxHistory = 2
    Lacking = {1}
    BaaWalk <- BaaWalkInFileOrder
INVARIANT TargetModelFirst
