id: identifier-kinds
language: TypeScript
severity: error
message: What counts as PHI lives in src/router/features/policy/. Import its index.ts.
ignores:
   - src/router/features/policy/**
   - tools/oxlint/anti-slop/**
   - tools/gates/fixtures/**
rule:
   regex: "^(patient-name|ssn|birth-date|patient-date|street-address|geographic-detail|personal-phone|personal-fax|personal-email|personal-url|ip-address|member-number|medicare-medicaid-number|mrn|claim-number|account-number|driver-license|certificate-license|passport|vehicle-identifier|device-identifier|biometric|face-photo)$"
   any:
      - kind: string_fragment
      - kind: property_identifier
      - kind: shorthand_property_identifier
      - kind: shorthand_property_identifier_pattern
